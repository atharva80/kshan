name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Real Postgres for tests/test_lexical_sql.py (pgvector image = the one the app targets;
      # the SQL tests themselves only need pg_trgm, which ships in contrib).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vsearch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vsearch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VSEARCH_TEST_DSN: postgresql://postgres:postgres@localhost:5432/vsearch_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Dev requirements only. Do not install requirements.txt (torch, CUDA, whisper...): the
      # tested modules are stdlib-only and vsearch/__init__.py imports nothing heavy.
      - name: Install dev requirements
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
